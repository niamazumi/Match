name: Matchs du jour
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python matchs_du_jour.py
        env:
          PAGE_URL: ${{ vars.PAGE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ENVOI: ${{ secrets.EMAIL_ENVOI }}
          EMAIL_MOT_DE_PASSE: ${{ secrets.EMAIL_MOT_DE_PASSE }}
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
      - name: Publier la page web
        if: always()
        run: |
          mkdir -p docs
          cp matchs_du_jour.html docs/index.html
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Mise à jour des matchs" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats
          path: |
            winner_page.txt
            matchs_du_jour.html
